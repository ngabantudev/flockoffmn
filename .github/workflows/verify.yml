name: Verify

# The gate that makes merging to `main` safe to be automatic.
#
# `main` is the Cloudflare Pages production branch, so a merge publishes to
# flockoffmn.org with no further step. That is the intended workflow — every
# PR is its own preview, and the merge is the release. What was missing is
# anything standing between the two: the only check on a PR was Cloudflare's
# own build, and `npm run build` is `astro build` alone, which does not
# typecheck. A commit that fails `npm run check` builds clean, deploys green,
# and lands on the live site. Measured, not assumed: a planted
# `const n: number = "not a number"` gives 1 error from `npm run check` and a
# successful 16-page build from `npm run build`.
#
# CLAUDE.md already says `npm run check` must stay at 0 errors. Until now that
# was holding on the discipline of whoever was at the keyboard, which §0.8
# ("assume no maintainer") says is exactly the kind of thing to write down as
# a rule a machine enforces.
#
# Deliberately only the two commands the repo already documents in Part 2 —
# no new dependency, no new tool to learn, nothing that fails for a reason a
# stranger rebuilding this in ten years cannot look up. `npm run data` is not
# here on purpose: it hits live upstream sources, so a federal portal having
# a bad afternoon would block an unrelated CSS fix. The scheduled
# refresh-data workflow owns that, and it already runs `npm run build`
# against whatever it pulls.

on:
  pull_request:
  # Also on pushes to main, so a merge that somehow arrives without a passing
  # PR — an admin override, a direct commit, a rebase that changed the
  # content — still gets told on rather than sliding through unexamined.
  push:
    branches: [main]

# A force-push to a PR branch makes the run already in flight irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    # Raised from 10 when the browser suites moved in here: they add a Chromium
    # download plus about a minute of real page-driving on top of install and
    # build. The ceiling is a runaway guard, not a budget.
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # Before the build, so a type error is reported as a type error rather
      # than as whatever it happens to break downstream.
      - name: Typecheck
        run: npm run check

      - name: Build
        run: npm run build

      # After the build, because the suites drive the built site in dist/ over a
      # local static server rather than a dev server — see tests/lib/harness.mjs.
      #
      # Chromium only, and no --with-deps: ubuntu-latest already carries the
      # shared libraries Playwright needs, and pulling them costs about a minute
      # per run to install what is already there. If a future runner image drops
      # them this step fails loudly on a missing .so, which is the right way to
      # find out.
      - name: Install Chromium for the browser suites
        run: npx playwright install chromium

      # These are the checks that catch what a typecheck cannot: a chip that
      # outran its data, a contrast ratio, a nav label clipped at 320px, a panel
      # left inert with no visible control to undo it, the rail fetching on a
      # phone that will never show it. They existed and did not run here, which
      # meant a change could break the rail and still go green.
      - name: Browser suites
        run: npm test
