name: PR preview link

# Cloudflare Pages' own Git integration already builds and deploys a preview
# for every push and reports it back to GitHub as a check named "Cloudflare
# Pages" (see wrangler.jsonc's comment on why that's a check rather than a
# deploy step in this repo's own Actions). That check is real but easy to
# miss: the preview URL sits inside the check's own output, one "Details"
# click and one expand away, not something a reviewer sees just by opening
# the PR.
#
# This workflow adds nothing to the deploy itself — it only copies the same
# URL Cloudflare already computed into a normal, visible PR comment, so
# opening the PR is enough to find a working link to click. Same tradeoff
# wrangler.jsonc names for Pages' Git integration in the first place: a
# reviewer (or the person who asked for the change) clicking a link beats
# anyone checking out a branch locally.
#
# Triggers on `pull_request`, then polls the Checks API for the Cloudflare
# check to finish, rather than reacting to a `check_run` webhook — a prior
# version of this workflow used `on: check_run`, which never fired: GitHub
# only delivers that webhook for a check if the app that created it is
# itself subscribed to send `check_run` events, and the Cloudflare Workers
# and Pages app is subscribed to only `pull_request` and `push` (confirmed
# via `GET /repos/:owner/:repo/commits/:sha/check-runs` → `app.events`).
# Every run of that version showed `skipped` for exactly this reason — not
# a timing issue, a webhook this repo will never receive. Polling sidesteps
# needing that webhook at all.
#
# A PR opened from a fork still won't get a comment: `pull_request` (as
# opposed to `pull_request_target`, deliberately not used here — it would
# run this script against a fork's ref with a token that has write access,
# which is the classic path to a fork's PR hijacking repo secrets) hands
# forked-PR runs a read-only token no matter what `permissions:` above
# claims, so the comment step fails closed. There is no maintainer capacity
# here to chase that edge case; a fork contributor still has the Checks tab
# as a fallback.

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  pull-requests: write
  issues: write

jobs:
  comment-preview-link:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Wait for the Cloudflare Pages check, then post or update the preview-link comment
        uses: actions/github-script@v7
        with:
          script: |
            const sha = context.payload.pull_request.head.sha;
            const prNumber = context.payload.pull_request.number;

            // Poll rather than a single lookup: the Cloudflare check may not
            // exist yet (its own webhook hasn't landed) or may still be
            // in_progress when this job starts, since a real Pages build
            // takes real time. 10s * 60 = 10 minutes, matching the job
            // timeout above so a genuinely stuck build fails visibly
            // instead of polling forever.
            let checkRun = null;
            for (let attempt = 0; attempt < 60; attempt++) {
              const { data } = await github.rest.checks.listForRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: sha,
                check_name: 'Cloudflare Pages',
              });
              const found = data.check_runs[0];
              if (found && found.status === 'completed') {
                checkRun = found;
                break;
              }
              await new Promise((resolve) => setTimeout(resolve, 10_000));
            }

            if (!checkRun) {
              core.warning('Cloudflare Pages check never completed within the polling window.');
              return;
            }
            if (checkRun.conclusion !== 'success') {
              core.warning(`Cloudflare Pages check finished with conclusion "${checkRun.conclusion}", not "success" — no preview to link.`);
              return;
            }

            const summary = checkRun.output?.summary || '';
            // Cloudflare's own check body — a small HTML table, not markdown.
            // The branch alias is preferred over the deploy-specific "Preview
            // URL" above it: it's stable across every push to this branch,
            // so the comment stays correct as new commits land rather than
            // pointing at a single superseded deploy.
            const match = summary.match(
              /Branch Preview URL:<\/strong><\/td><td>\s*<a href='([^']+)'/
            );
            if (!match) {
              core.warning('Cloudflare Pages check had no Branch Preview URL to copy.');
              return;
            }
            const url = match[1];
            const marker = '<!-- cloudflare-preview-link -->';
            const body = `${marker}\n🔍 **Preview:** ${url}`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              per_page: 100,
            });
            const existing = comments.find((c) => c.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body,
              });
            }
